<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Registration Preview - DOM Based</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 30px;
        display: flex;
        justify-content: center;
    }
    .container {
        background: #fff;
        padding: 30px 40px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        width: 500px;
        max-width: 95%;
    }
    h2 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 20px;
    }
    label {
        display: block;
        margin-top: 12px;
        font-weight: 600;
        color: #34495e;
    }
    input, select {
        width: 100%;
        padding: 8px 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
    }
    .btn-group {
        margin-top: 20px;
        display: flex;
        gap: 10px;
    }
    button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
    }
    #displayBtn {
        background: #2ecc71;
        color: white;
    }
    #displayBtn:hover { background: #27ae60; }
    #removeBtn {
        background: #e74c3c;
        color: white;
    }
    #removeBtn:hover { background: #c0392b; }

    #profileCard {
        margin-top: 25px;
        padding: 20px;
        border-radius: 8px;
        border: 2px solid #3498db;
        background: #eaf4fd;
        display: none;
    }
    #profileCard.show {
        display: block;
        animation: fadeIn 0.3s ease-in-out;
    }
    #profileCard h3 {
        margin-top: 0;
        color: #2980b9;
        border-bottom: 1px solid #bcd9ef;
        padding-bottom: 8px;
    }
    #profileCard p {
        margin: 6px 0;
        color: #2c3e50;
    }
    #profileCard p span {
        font-weight: bold;
        color: #34495e;
    }
    .error {
        border-color: #3498db;
        background: #fdecea !important;
        border-color: #e74c3c !important;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<div class="container">
    <h2>Student Registration Form</h2>

    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter full name">

    <label for="regNo">Register Number</label>
    <input type="text" id="regNo" placeholder="Enter register number">

    <label for="dept">Department</label>
    <input type="text" id="dept" placeholder="Enter department">

    <label for="year">Year of Study</label>
    <select id="year">
        <option value="">-- Select Year --</option>
        <option value="1st Year">1st Year</option>
        <option value="2nd Year">2nd Year</option>
        <option value="3rd Year">3rd Year</option>
        <option value="4th Year">4th Year</option>
    </select>

    <div class="btn-group">
        <button id="displayBtn">Display Profile</button>
        <button id="removeBtn">Remove Profile</button>
    </div>

    <!-- Dynamically generated profile card -->
    <div id="profileCard"></div>
</div>

<script>
    // Select elements using getElementById and querySelector
    const nameInput  = document.getElementById('name');
    const regInput   = document.querySelector('#regNo');
    const deptInput  = document.querySelector('#dept');
    const yearInput  = document.getElementById('year');

    const displayBtn = document.getElementById('displayBtn');
    const removeBtn  = document.querySelector('#removeBtn');
    const profileCard = document.getElementById('profileCard');

    // Event: Display Profile
    displayBtn.addEventListener('click', function () {
        const name  = nameInput.value.trim();
        const reg   = regInput.value.trim();
        const dept  = deptInput.value.trim();
        const year  = yearInput.value;

        // Basic validation
        if (!name || !reg || !dept || !year) {
            [nameInput, regInput, deptInput, yearInput].forEach(el => {
                if (!el.value.trim()) el.classList.add('error');
                else el.classList.remove('error');
            });
            alert('Please fill in all fields before displaying the profile.');
            return;
        } else {
            [nameInput, regInput, deptInput, yearInput].forEach(el => el.classList.remove('error'));
        }

        // Clear previous content (element removal)
        profileCard.innerHTML = '';

        // Build profile dynamically using createElement + textContent
        const heading = document.createElement('h3');
        heading.textContent = 'Student Profile';

        const pName = document.createElement('p');
        const spanName = document.createElement('span');
        spanName.textContent = 'Name: ';
        pName.appendChild(spanName);
        pName.appendChild(document.createTextNode(name));

        const pReg = document.createElement('p');
        const spanReg = document.createElement('span');
        spanReg.textContent = 'Register Number: ';
        pReg.appendChild(spanReg);
        pReg.appendChild(document.createTextNode(reg));

        const pDept = document.createElement('p');
        const spanDept = document.createElement('span');
        spanDept.textContent = 'Department: ';
        pDept.appendChild(spanDept);
        pDept.appendChild(document.createTextNode(dept));

        const pYear = document.createElement('p');
        const spanYear = document.createElement('span');
        spanYear.textContent = 'Year of Study: ';
        pYear.appendChild(spanYear);
        pYear.appendChild(document.createTextNode(year));

        profileCard.appendChild(heading);
        profileCard.appendChild(pName);
        profileCard.appendChild(pReg);
        profileCard.appendChild(pDept);
        profileCard.appendChild(pYear);

        // Use classList to visually distinguish / show the card
        profileCard.classList.add('show');
    });

    // Event: Remove Profile
    removeBtn.addEventListener('click', function () {
        profileCard.innerHTML = '';
        profileCard.classList.remove('show');
    });
</script>

</body>
</html>
