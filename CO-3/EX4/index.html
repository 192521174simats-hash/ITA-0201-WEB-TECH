<!DOCTYPE html>
<html>
<head><title>Browser Information Dashboard</title>
<style>
body{font-family:Arial;background:#ecfeff;padding:30px}.box{max-width:850px;margin:auto;background:white;padding:25px;border-radius:15px}
table{width:100%;border-collapse:collapse}td{padding:10px;border:1px solid #aaa}
</style></head>
<body>
<div class="box">
<h2>Browser Information Dashboard</h2>
<table id="info"></table>
</div>
<script>
const rows=[
["Browser Language",navigator.language],
["Online Status",navigator.onLine?"Online":"Offline"],
["Platform",navigator.platform],
["User Agent",navigator.userAgent],
["Screen Width",screen.width+" px"],
["Screen Height",screen.height+" px"],
["Window Width",innerWidth+" px"],
["Window Height",innerHeight+" px"],
["Scroll X",scrollX+" px"],
["Scroll Y",scrollY+" px"]
];
document.getElementById("info").innerHTML=rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("");
window.addEventListener("resize",()=>location.reload());
window.addEventListener("online",()=>location.reload());
window.addEventListener("offline",()=>location.reload());
</script>
</body></html>
