<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Scientific Calculator</title>
<style>
body{font-family:Arial;background:#eef2f7}.calc{width:350px;margin:40px auto;background:#581c87;padding:20px;border-radius:15px}
#display{width:100%;height:60px;font-size:25px;text-align:right;padding:10px;margin-bottom:12px;border-radius:8px}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{padding:16px;font-size:16px;border:0;border-radius:7px;cursor:pointer}
</style></head><body><div class="calc"><input id="display" readonly><div class="buttons">
<button onclick="clearDisplay()">C</button><button onclick="del()">DEL</button><button onclick="add('(')">(</button><button onclick="add(')')">)</button>
<button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button onclick="add('/')">÷</button>
<button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button onclick="add('*')">×</button>
<button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button onclick="add('-')">−</button>
<button onclick="add('0')">0</button><button onclick="add('.')">.</button><button onclick="calculate()">=</button><button onclick="add('+')">+</button>
<button onclick="square()">x²</button><button onclick="sqrt()">√</button><button onclick="sin()">sin</button><button onclick="cos()">cos</button>
</div></div>
<script>
const d=document.getElementById("display");
function add(x){d.value+=x} function clearDisplay(){d.value=""} function del(){d.value=d.value.slice(0,-1)}
function calculate(){try{d.value=Function("return "+d.value)()}catch(e){d.value="Error"}}
function square(){try{d.value=Math.pow(eval(d.value),2)}catch(e){d.value="Error"}}
function sqrt(){try{d.value=Math.sqrt(eval(d.value))}catch(e){d.value="Error"}}
function sin(){try{d.value=Math.sin(eval(d.value)*Math.PI/180)}catch(e){d.value="Error"}}
function cos(){try{d.value=Math.cos(eval(d.value)*Math.PI/180)}catch(e){d.value="Error"}}
</script></body></html>
