<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Registration</title>
<style>
body{font-family:Arial;background:#eef2f7}.form{max-width:550px;margin:30px auto;background:white;padding:30px;border-radius:15px;box-shadow:0 5px 20px #0002}
label{display:block;margin-top:15px;font-weight:bold}input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #bbb;border-radius:7px}
button{margin-top:20px;width:100%;padding:12px;background:#3457d5;color:white;border:0;border-radius:7px;cursor:pointer}.error{color:#d00;font-size:13px}.success{color:green;text-align:center;font-weight:bold}
</style></head>
<body><div class="form"><h1>Student Registration</h1><form id="regForm">
<label>Name</label><input id="name"><span class="error" id="nameErr"></span>
<label>Email</label><input id="email" type="email"><span class="error" id="emailErr"></span>
<label>Phone</label><input id="phone"><span class="error" id="phoneErr"></span>
<label>Department</label><select id="dept"><option value="">Select</option><option>CSE</option><option>ECE</option><option>EEE</option><option>IT</option></select><span class="error" id="deptErr"></span>
<label>Password</label><input id="password" type="password"><span class="error" id="passErr"></span>
<button type="submit">Register</button><p class="success" id="success"></p></form></div>
<script>
const form=document.getElementById("regForm");
form.addEventListener("submit",function(e){
e.preventDefault(); document.querySelectorAll(".error").forEach(x=>x.textContent=""); document.getElementById("success").textContent="";
let valid=true;
if(!/^[A-Za-z ]{3,}$/.test(name.value.trim())){nameErr.textContent="Enter a valid name";valid=false}
if(!/^[^ ]+@[^ ]+\.[^ ]+$/.test(email.value.trim())){emailErr.textContent="Enter a valid email";valid=false}
if(!/^[0-9]{10}$/.test(phone.value.trim())){phoneErr.textContent="Enter a 10-digit phone number";valid=false}
if(!dept.value){deptErr.textContent="Select a department";valid=false}
if(!/^(?=.*[A-Za-z])(?=.*\d).{6,}$/.test(password.value)){passErr.textContent="Password must be 6+ chars with letters and numbers";valid=false}
if(valid)success.textContent="Registration successful!";
});
</script></body></html>
