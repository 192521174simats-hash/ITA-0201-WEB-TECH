<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Result Processing</title>
<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #4facfe 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px;
        margin: 0;
    }
    .container {
        background: #fff;
        padding: 30px 40px;
        border-radius: 10px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        width: 450px;
        max-width: 95%;
    }
    h2 { text-align: center; color: #2c3e50; }
    label { display: block; margin-top: 12px; font-weight: 600; color: #34495e; }
    input {
        width: 100%; padding: 8px 10px; margin-top: 5px;
        border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
        box-sizing: border-box;
    }
    input:focus {
        outline: none;
        border-color: #764ba2;
        box-shadow: 0 0 0 3px rgba(118,75,162,0.15);
    }
    button {
        margin-top: 20px; width: 100%; padding: 10px; border: none;
        border-radius: 6px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff; font-size: 15px; font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s ease;
    }
    button:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="container">
    <h2>Student Result Entry</h2>
    <!-- Task requirement: HTML form using POST method to a Servlet using doPost() -->
    <form action="ResultServlet" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="regNo">Register Number</label>
        <input type="text" id="regNo" name="regNo" required>

        <label for="mark1">Subject 1 Mark (0-100)</label>
        <input type="text" id="mark1" name="mark1" required>

        <label for="mark2">Subject 2 Mark (0-100)</label>
        <input type="text" id="mark2" name="mark2" required>

        <label for="mark3">Subject 3 Mark (0-100)</label>
        <input type="text" id="mark3" name="mark3" required>

        <button type="submit">Submit</button>
    </form>
</div>
</body>
</html>
