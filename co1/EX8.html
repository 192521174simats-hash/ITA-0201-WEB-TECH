<!DOCTYPE html>
<html>
<head>
    <title>Images, Hyperlinks and Iframes</title>
</head>

<body bgcolor="lightyellow">

    <h1 align="center">Images, Hyperlinks and Iframes</h1>

    <hr>

    <h2>1. Displaying an Image</h2>

    <img src="college.jpg"
         alt="College Image"
         width="400"
         height="250">

    <hr>

    <h2>2. Hyperlink Example</h2>

    <p>
        Visit Google:
        <a href="https://www.google.com" target="_blank">
            Click Here
        </a>
    </p>

    <p>
        Visit Wikipedia:
        <a href="https://www.wikipedia.org" target="_blank">
            Click Here
        </a>
    </p>

    <hr>

    <h2>3. Iframe Example</h2>

    <iframe
        src="https://www.wikipedia.org"
        width="700"
        height="400">
    </iframe>

    <hr>

    <h3 align="center">End of Program</h3>

</body>
</html>
