<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body bgcolor="lightcyan">

    <h1 align="center">Student Registration Form</h1>
    <hr>

    <form>

        <table align="center" cellpadding="8">

            <tr>
                <td>Full Name</td>
                <td>
                    <input type="text" name="fullname" placeholder="Enter your name">
                </td>
            </tr>

            <tr>
                <td>Roll Number</td>
                <td>
                    <input type="text" name="rollno" placeholder="Enter roll number">
                </td>
            </tr>

            <tr>
                <td>Password</td>
                <td>
                    <input type="password" name="password" placeholder="Enter password">
                </td>
            </tr>

            <tr>
                <td>Email</td>
                <td>
                    <input type="email" name="email" placeholder="Enter email">
                </td>
            </tr>

            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" value="Male"> Male
                    <input type="radio" name="gender" value="Female"> Female
                </td>
            </tr>

            <tr>
                <td>Department</td>
                <td>
                    <select name="department">
                        <option>Select Department</option>
                        <option>CSE</option>
                        <option>IT</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>Mechanical</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Skills</td>
                <td>
                    <input type="checkbox" name="html"> HTML
                    <input type="checkbox" name="css"> CSS
                    <input type="checkbox" name="javascript"> JavaScript
                    <input type="checkbox" name="python"> Python
                </td>
            </tr>

            <tr>
                <td>Address</td>
                <td>
                    <textarea rows="5" cols="30" placeholder="Enter your address"></textarea>
                </td>
            </tr>

            <tr>
                <td>Date of Birth</td>
                <td>
                    <input type="date" name="dob">
                </td>
            </tr>

            <tr>
                <td>Mobile Number</td>
                <td>
                    <input type="tel" name="mobile" placeholder="Enter mobile number">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </td>
            </tr>

        </table>

    </form>

    <hr>

    <p align="center"><b>Student Registration Form</b></p>

</body>
</html>
